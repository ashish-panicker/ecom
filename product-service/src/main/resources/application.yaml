server:
  port: 9100
spring:
  application:
    name: product-service
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    com:
      example:
        productservice:
          auth:
            filters: DEBUG
          domain:
            controller: DEBUG
