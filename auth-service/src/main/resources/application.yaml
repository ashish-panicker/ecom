spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mariadb://localhost:3306/identity_db
    username: spring_user
    password: password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        type:
          descriptor:
            sql:
              basic_binder: WARN
        hbm2ddl:
          auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.int}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
app:
  node:
    worker-id: 101
    datacenter-id: 114